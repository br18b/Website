title: Braňo's playground
author: Branislav Rabatin
email: rabatinb@gmail.com
description: >-
  My personal portfolio.
url: "https://rabatinb.com"
baseurl: ""
github_username: br18b

# Build settings
theme: minima
plugins:
  - jekyll-feed

collections:
  projects:
    output: true
    permalink: /projects/:name/

# Assets that should be copied as-is.
include:
  - assets/js

highlighter: rouge
markdown: kramdown
kramdown:
  syntax_highlighter: rouge

sass:
  sass_dir: _sass
  style: compressed

# Keep local/source-only artifacts out of the built site.
exclude:
  - README.md
  - MIGRATION_NOTES.md
  - LOCAL_DEVELOPMENT.md
  - Gemfile.lock
  - .github/
  - .bundle/
  - .jekyll-cache/
  - .sass-cache/
  - node_modules/
  - vendor/

  - data/
  - docs/
  - work/

  - raw/
  - notebooks/
  - scripts

  - fractal/mandelbrot/G_contours
  - fractal/mandelbrot/component_catalogue
  - fractal/mandelbrot/G_contours_probe_1e7
  - fractal/mandelbrot/G_contours_probe_1e8
  - fractal/mandelbrot/atlas_data
  - fractal/3D

  # Mathematica
  - "*.nb"
  - "**/*.nb"

  # scripts
  - "*.py"
  - "**/*.py"
  - "*.sh"
  - "**/*.sh"

  # Scientific data
  - "*.fits"
  - "**/*.fits"
  - "*.npy"
  - "**/*.npy"
  - "*.npz"
  - "**/*.npz"
  - "*.h5"
  - "**/*.h5"
  - "*.hdf5"
  - "**/*.hdf5"
  - "*.ply"
  - "**/*.ply"

  # Tables and binary data
  - "*.csv"
  - "**/*.csv"
  - "*.tsv"
  - "**/*.tsv"
  - "*.bin"
  - "**/*.bin"

# Sensible defaults: opt pages into heavier scripts only when needed.
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "projects"
    values:
      layout: project
      gallery: true
