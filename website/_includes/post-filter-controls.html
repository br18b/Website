<div class="post-filter" data-post-filter-controls aria-label="Post filter">
  <span class="post-filter__label">Show</span>
  <div class="post-filter__switch" role="group" aria-label="Choose which posts to show">
    <button class="post-filter__button" type="button" data-post-filter-button="all" aria-pressed="true">All</button>
    <button class="post-filter__button" type="button" data-post-filter-button="featured" aria-pressed="false">Featured only</button>
  </div>
</div>
