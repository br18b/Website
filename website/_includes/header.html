<header class="site-header" role="banner">
  <div class="wrapper site-header__inner">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">Home</a>

    <nav class="site-nav" aria-label="Main navigation">
      <input type="checkbox" id="nav-trigger" class="nav-trigger" />
      <label for="nav-trigger" class="nav-trigger-label" aria-label="Open navigation">
        <span class="menu-icon" aria-hidden="true">
          <svg viewBox="0 0 18 15" width="18" height="15">
            <path d="M18,1.484c0,.82-.665,1.484-1.484,1.484H1.484C.665,2.969,0,2.304,0,1.484S.665,0,1.484,0h15.032C17.335,0,18,.665,18,1.484zM18,7.516C18,8.335,17.335,9,16.516,9H1.484C.665,9,0,8.335,0,7.516s.665-1.484,1.484-1.484h15.032C17.335,6.031,18,6.696,18,7.516zM18,13.516C18,14.335,17.335,15,16.516,15H1.484C.665,15,0,14.335,0,13.516s.665-1.483,1.484-1.483h15.032c.819,0,1.484,.664,1.484,1.483z"/>
          </svg>
        </span>
      </label>

      <div class="trigger">
        {% for item in site.data.nav %}
          <a class="page-link" href="{{ item.url | relative_url }}">{{ item.title | escape }}</a>
        {% endfor %}
      </div>
    </nav>
  </div>
</header>
