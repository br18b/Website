<footer class="site-footer">
  <div class="wrapper site-footer__inner">
    <p>&copy; {{ 'now' | date: '%Y' }} {{ site.author | default: site.title }}.</p>
    <p class="site-footer__links">
      {% if site.data.links.github %}<a href="{{ site.data.links.github }}">GitHub</a>{% endif %}
      {% if site.data.links.email %}<a href="{{ site.data.links.email }}">Email</a>{% endif %}
    </p>
  </div>
</footer>
